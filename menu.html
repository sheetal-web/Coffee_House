<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hotel Menu</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <style>
    body {
      background-color: rgb(248, 210, 177);
    }

    h2 {
      font-size: 60px;
    }

    .menu-card {
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.3s ease-in-out;
      height: 100%;
    }

    .menu-card:hover {
      transform: scale(1.05);
    }

    .menu-card img {
      height: 200px;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center mb-4">Our Menu</h2>
    <div class="row" id="menu-container">
      <!-- Dishes will be inserted dynamically -->
    </div>
    <div class="text-center mt-4">
      <a href="index.html" class="btn btn-secondary">Go Back to Home Page</a>
    </div>
  </div>

  <script>
    const menuItems = [
      { id: 1, name: "Burger", price: 12.99, image: "pics/burger.jpeg" },
      { id: 2, name: "Coffee", price: 10.99, image: "pics/coffee.jpeg" },
      { id: 3, name: "Pizza", price: 15.99, image: "pics/pizza.jpeg" },
      { id: 4, name: "Pancake", price: 9.99, image: "pics/Fluffy Lemon Blueberry Pancakes.jpg" },
      { id: 5, name: "Sandwich", price: 11.49, image: "pics/sandwich.jpeg" },
      { id: 6, name: "manchurian noodles", price: 2.99, image: "pics/Gobi Manchurian.jpg" },
      { id: 7, name: "Fries", price: 13.49, image: "pics/Crispy Sweet Potato Fries - Air Fryer or Oven!.jpg" },
      { id: 8, name: "Red Velvet cake", price: 5.99, image: "pics/Decadent Red Velvet Oreo Cheesecake Recipe.jpg" },
      { id: 9, name: "Pasta", price: 4.99, image: "pics/Creamy Roasted Tomato and Garlic Ricotta Pasta.jpg" }
    ];

    const menuContainer = document.getElementById("menu-container");

    menuItems.forEach(item => {
      let dishCard = document.createElement("div");
      dishCard.classList.add("col-md-4", "mb-4");
      dishCard.innerHTML = `
        <div class="card menu-card shadow-sm">
          <img src="${item.image}" class="card-img-top" alt="${item.name}">
          <div class="card-body text-center">
            <h5 class="card-title">${item.name}</h5>
            <p class="card-text">Price: $${item.price.toFixed(2)}</p>
            <button class="btn btn-primary" onclick="addToCart(${item.id})">Add to Cart</button>
          </div>
        </div>
      `;
      menuContainer.appendChild(dishCard);
    });

    function addToCart(productId) {
  const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";
  const user = JSON.parse(localStorage.getItem("user"));

  if (!isLoggedIn || !user) {
    alert("Please login to add items to your cart.");
    window.location.href = 'login.html';
    return;
  }

  const item = menuItems.find(i => i.id === productId);
  let cart = JSON.parse(localStorage.getItem('cart')) || [];

  const existingItem = cart.find(i => i.id === productId);
  if (existingItem) {
    existingItem.qty += 1;
  } else {
    cart.push({ ...item, qty: 1 });
  }

  localStorage.setItem('cart', JSON.stringify(cart));
  alert(`${item.name} added to cart!`);
}


  </script>
  <script src="menu.js"></script>
</body>
</html>
